# FilsPay — the whole stack on one box (1 vCPU / 2 GB RAM).
#
#   ./ops/gen-secrets.sh                      # writes ops/.env (once)
#   docker compose -f ops/docker-compose.yml up -d --build
#
# What changed vs. the handover version (docs/FINDINGS.md, "Hosting"):
#   - Dockerfile.node / Dockerfile.go / .env.docker were referenced but never
#     committed, so the stack could not be built from the repo. They exist now.
#   - Postgres was published on 0.0.0.0:5432 with a password in this file.
#     It is now internal-only, and every secret comes from ops/.env.
#   - NODE_ENV was never set, so the API ran in "development": OTP codes in
#     the login response, a hard-coded webhook key, insecure cookies,
#     unsigned acquirer callbacks accepted. It is now production.
#   - No resource limits, no restart policy, no healthchecks. Each service now
#     has CPU/memory caps that fit the box (API: 0.5 vCPU / 512 MB as
#     required), restarts automatically, and is restarted when unhealthy.
#   - The `seed` job truncates tables; it is behind a profile so `up` can
#     never reset a database by accident (staging-2).

x-node-env: &node-env
  NODE_ENV: production
  DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay
  SETTLEMENT_INTERNAL_URL: http://settlement:8091
  SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN}
  WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY}
  ACQUIRER_CALLBACK_SIGNING_SECRET: ${ACQUIRER_CALLBACK_SIGNING_SECRET}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # No email/SMS provider exists: set true in ops/.env to read login codes
  # with `docker compose logs api` (never returned in the HTTP response).
  OTP_LOG_CODES: ${OTP_LOG_CODES:-false}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: filspay
    # Sized for a 2 GB box. synchronous_commit stays ON: an acknowledged
    # payment must survive a crash.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=60
      - -c
      - random_page_cost=1.1
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: 0.4
    mem_limit: 768m

  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npx", "tsx", "db/migrate.ts"]
    environment: *node-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Demo data. TRUNCATE ... CASCADE wipes merchants and everything that
  # references them (not just "fixture tables"). Only runs when asked for,
  # and db/seed/index.ts refuses a database holding non-seed users unless
  # SEED_CONFIRM_WIPE=<database name> is set (R9):
  #   docker compose -f ops/docker-compose.yml --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npx", "tsx", "db/seed/index.ts"]
    environment: *node-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    # Heap capped below the container limit so V8 collects before the kernel
    # OOM-kills the container.
    command: ["node", "--max-old-space-size=320", "--import", "tsx", "apps/api/src/index.ts"]
    restart: unless-stopped
    environment:
      <<: *node-env
      PG_POOL_MAX: "25"
      MAX_POOL_WAITERS: "40"
      MAX_IN_FLIGHT_REQUESTS: "200"
      KYC_UPLOAD_DIR: /app/data/kyc
    volumes:
      - filspay_kyc:/app/data/kyc
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 20s
    cpus: 0.5
    mem_limit: 512m

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    command: ["daemon"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully
    cpus: 0.2
    mem_limit: 128m

  reporting:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["node", "--max-old-space-size=128", "--import", "tsx", "apps/reporting/src/index.ts"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay
    depends_on:
      migrate:
        condition: service_completed_successfully
    cpus: 0.15
    mem_limit: 192m

  # Dashboard + ops console + reverse proxy (automatic HTTPS with a domain).
  web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ADMIN_ADDRESS: ${ADMIN_ADDRESS:-:8080}
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - caddy_data:/data
    depends_on:
      - api
    cpus: 0.15
    mem_limit: 96m

volumes:
  filspay_pgdata:
  filspay_kyc:
  caddy_data:
